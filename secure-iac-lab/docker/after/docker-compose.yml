services:
  web:
    build: .
    image: secure-iac-lab/web:1.0.0
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      SECRET_KEY_FILE: /run/secrets/secret_key
    secrets:
      - secret_key
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    pids_limit: 100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

secrets:
  secret_key:
    file: ./secret_key.txt
